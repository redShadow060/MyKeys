<ion-menu contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Menu Content</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <ion-button style="width: 100%;" id="open-modal" color="danger" expand="block">Clear
      database</ion-button>
    <ion-button [disabled]="sending" style="width: 100%;" id="open-modal" (click)="showSendData()">send
      database</ion-button>
    <ion-input *ngIf="showSend" class="flex-center" [(ngModel)]="url"></ion-input>
    <ion-button *ngIf="showSend" color="secondary" style="width: 100%;" id="open-modal"
      (click)="downloadDatabase()">send now</ion-button>
    <ion-progress-bar *ngIf="sending" type="indeterminate"></ion-progress-bar>
    <ion-button style="width: 100%;" id="open-modal2" color="warning" expand="block">Upload data</ion-button>
    <div style="position: absolute;    bottom: 0px;    width: 90%;">

      <ion-item>
        <ion-label>Version:</ion-label>
        <ion-note>1.0.4</ion-note>
      </ion-item>
      <ion-item>
        <ion-label>Developed by</ion-label>
        <ion-note slot="end">Faycal TOUAHRI</ion-note>
      </ion-item>
    </div>
    <ion-modal #modal1 trigger="open-modal" (willDismiss)="onWillDismiss($event)">
      <ng-template>
        <div style="height: -webkit-fill-available; overflow-y: hidden;" *ngIf="view === 'delete'">
          <ion-header>
            <ion-toolbar>
              <ion-buttons slot="start">
                <ion-button (click)="cancel()">Cancel</ion-button>
              </ion-buttons>
              <ion-title>Are you sure?</ion-title>
              <ion-buttons slot="end">
                <ion-button (click)="confirm()" [strong]="true">Confirm</ion-button>
              </ion-buttons>
            </ion-toolbar>
          </ion-header>
          <ion-content class="ion-padding">
            This action will delete all data in the database.
          </ion-content>
        </div>
      </ng-template>
    </ion-modal>
    <ion-modal #modal2 trigger="open-modal2" (willDismiss)="onWillDismiss2($event)">
      <ng-template>
        <div>
          <input type="file" #fileInput (change)="onFileSelected($event)" style="display: none;" accept=".json">
          <ion-button id="open-loading" [disabled]="updloadFlag" (click)="fileInput.click()"
            style="width: 100%;padding: 10px;">Upload JSON</ion-button>
          <!-- <ion-loading trigger="open-loading" message="Uploading..." spinner="circles"></ion-loading> -->
        </div>
      </ng-template>
    </ion-modal>
  </ion-content>
</ion-menu>
<ion-toast trigger="open-toast" message="The records has been successfully stored" [duration]="3000"></ion-toast>
<div id="main-content">
  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
        <ion-button (click)="openMenu()"></ion-button>
      </ion-buttons>
      <ion-title>
        Key Database
      </ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content [fullscreen]="true">
    <!-- <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">TEST BLANK</ion-title>
    </ion-toolbar>
  </ion-header> -->

    <div id="container">
      <ion-toolbar>
        <ion-buttons class="buttons">
          <ion-button class="button"
            [style]="selected ==='search'? 'background-color: #1a9ceb82; border-bottom: 6px solid blueviolet':'' "
            (click)="select('search')">Search</ion-button>
          <ion-button class="button"
            [style]="selected ==='inventory'? 'background-color: #1a9ceb82; border-bottom: 6px solid blueviolet':''"
            (click)="select('inventory')">Inventory</ion-button>
        </ion-buttons>
      </ion-toolbar>
      <div style="display: flex; height: calc(100% - 56px);">
        <ion-card style="width: 100%;">
          <app-search [event]="event" [makes]="makeList" [models]="modelList" [trims]="trimList" style="width: 100%;"
            *ngIf="selected ==='search'" (outputEvent)="handleEvent($event)"></app-search>
          <app-inventory [makes]="makeList" [models]="modelList" [trims]="trimList" [key]="key"
            *ngIf="selected ==='inventory'"></app-inventory>
        </ion-card>
      </div>
    </div>
  </ion-content>
</div>
